# Base de datos local para desarrollo (rama paoloProyectoBien): Postgres en Docker, separado de Supabase.
# Al crear el volumen por primera vez corre los .sql de database/ (esquema, catálogos y datos de prueba).
#   docker compose -f docker-compose.db.yml up -d      -> levanta la base en localhost:5433
#   docker compose -f docker-compose.db.yml down -v    -> la borra (con sus datos) para empezar de cero
# El back se conecta con: npm run dev:docker (lee .env.docker)
services:
  db:
    image: postgres:16-alpine
    container_name: paolo-proyecto-bien-db
    environment:
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos
      POSTGRES_DB: eventos
    volumes:
      - paolo_proyecto_bien_db:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos -d eventos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  paolo_proyecto_bien_db:
