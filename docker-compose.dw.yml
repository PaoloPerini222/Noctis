# Data Warehouse noctis_DW: base Postgres APARTE de la del sistema, solo para reportes.
# El back la llena con el ETL (src/dw/etl.js), que copia los datos de la base del sistema en un modelo estrella.
#   docker compose -f docker-compose.dw.yml up -d      -> levanta el DW en localhost:5434
#   docker compose -f docker-compose.dw.yml down -v    -> lo borra (el ETL lo vuelve a armar en la próxima carga)
# El back se conecta con las variables DW_DB_* del .env.
name: noctis_dw

services:
  noctis_dw:
    image: postgres:16-alpine
    container_name: noctis_DW
    environment:
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: dw
      POSTGRES_DB: noctis_DW
    volumes:
      - noctis_DW_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw -d noctis_DW"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Panel web para hacerle consultas SQL al DW desde el navegador: http://localhost:8082
  # Sistema: PostgreSQL · Servidor: noctis_dw · Usuario: dw · Contraseña: dw · Base de datos: noctis_DW
  # Hay consultas de ejemplo en src/dw/consultas.sql.
  adminer:
    image: adminer:4.8.1
    container_name: noctis_DW_adminer
    environment:
      ADMINER_DEFAULT_SERVER: noctis_dw
    ports:
      - "8082:8080"
    depends_on:
      - noctis_dw
    restart: unless-stopped

volumes:
  noctis_DW_data:
